<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>AmJ Ultimate Game Site</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

/* ================= THEME ================= */
:root{
  --gold:#d4af37;
  --dark:#05060a;
  --text:#e6e6e6;
  --panel:rgba(10,12,18,0.7);
}

body{
  margin:0;
  font-family:'Prompt',sans-serif;
  background:var(--dark);
  color:var(--text);
  overflow-x:hidden;
}

/* ================= BACKGROUND ================= */
.bg{
  position:fixed;
  inset:0;
  background:url("https://images.unsplash.com/photo-1606112219348-204d7d8b94ee?auto=format&fit=crop&w=1600&q=80");
  background-size:cover;
  filter:brightness(0.3);
  z-index:-1;
}

/* ================= HEADER ================= */
header{
  position:fixed;
  width:100%;
  padding:20px 40px;
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(10px);
  z-index:100;
}

.logo{
  color:var(--gold);
  font-size:24px;
  font-weight:bold;
}

/* ================= HERO ================= */
.hero{
  height:100vh;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 10%;
}

.hero h1{
  font-size:60px;
}

.hero span{
  color:var(--gold);
}

.hero-img{
  width:380px;
}

/* ================= CARD ================= */
.section{
  padding:120px 10%;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.card{
  background:var(--panel);
  padding:20px;
  border-radius:12px;
  transition:0.3s;
}

.card:hover{
  transform:translateY(-10px);
}

/* ================= 🐥 CHICK ================= */
#chick{
  position:fixed;
  width:80px;
  z-index:9999;
  pointer-events:none;
  transition:all 1.5s linear;
}

#bubble{
  position:fixed;
  background:white;
  color:black;
  padding:6px 10px;
  border-radius:10px;
  font-size:12px;
  z-index:9999;
  pointer-events:none;
  opacity:0;
  transition:0.3s;
}

</style>
</head>

<body>

<div class="bg"></div>

<header>
  <div class="logo">AmJ</div>
</header>

<section class="hero">
  <div>
    <h1>Welcome to <span>AmJ</span></h1>
    <p>Ultimate Game Experience</p>
  </div>

  <img class="hero-img"
  src="https://i.pinimg.com/originals/7c/e3/06/7ce306ca1201a5c34b2a1982d68475ea.gif">
</section>

<section class="section">
  <h2>Characters</h2>
  <div class="grid" id="cardContainer"></div>
</section>

<!-- 🐥 CHICK -->
<img id="chick" src="https://media.tenor.com/2roX3uxz_68AAAAi/cute-chicken.gif">
<div id="bubble"></div>

<script>

/* ================= DATA ================= */
const gameData = [
  { title:"⚔️ Assassin", desc:"Fast kill" },
  { title:"🔥 Mage", desc:"Magic burst" },
  { title:"🛡 Tank", desc:"High defense" }
];

const container=document.getElementById("cardContainer");

gameData.forEach(item=>{
  const div=document.createElement("div");
  div.className="card";
  div.innerHTML=`<h3>${item.title}</h3><p>${item.desc}</p>`;
  container.appendChild(div);
});

/* ================= 🐥 AI SYSTEM ================= */
const chick = document.getElementById("chick");
const bubble = document.getElementById("bubble");

let chickState = "wander";
let hunger = 0;
let sleep = 0;

let x = window.innerWidth/2;
let y = window.innerHeight/2;

let foods = [];

/* 🍞 วางอาหาร */
document.addEventListener("click",(e)=>{
  const food = document.createElement("div");
  food.style.position="fixed";
  food.style.left=e.clientX+"px";
  food.style.top=e.clientY+"px";
  food.innerHTML="🍞";
  food.style.fontSize="24px";
  document.body.appendChild(food);

  foods.push({x:e.clientX,y:e.clientY,el:food});
});

/* 🧠 AI LOOP */
setInterval(()=>{
  hunger+=1;
  sleep+=0.5;

  if(hunger > 50) chickState="hungry";
  if(sleep > 60) chickState="sleep";
},1000);

/* 🐥 MAIN */
function updateChick(){

  if(chickState==="sleep"){
    showBubble("😴 Zzz...");
    setTimeout(()=>{
      sleep=0;
      chickState="wander";
    },4000);
    return;
  }

  if(chickState==="hungry" && foods.length>0){
    let food = foods[0];
    showBubble("🍗 หิว!");
    moveTo(food.x,food.y);

    if(distance(x,y,food.x,food.y)<50){
      food.el.remove();
      foods.shift();
      hunger=0;
      chickState="wander";
      showBubble("😋 อิ่ม!");
    }
    return;
  }

  // หนีเมาส์
  if(mouseDist < 120){
    showBubble("😱");
    let angle = Math.atan2(y-mouseY, x-mouseX);
    moveTo(x + Math.cos(angle)*150, y + Math.sin(angle)*150);
    return;
  }

  // เดินตามเมาส์
  if(Math.random()<0.4){
    showBubble("🐥 จิ๊บๆ");
    moveTo(mouseX,mouseY);
    return;
  }

  // เดินสุ่ม
  let newX = Math.random()*window.innerWidth;
  let newY = Math.random()*window.innerHeight;
  moveTo(newX,newY);
}

/* 🎯 MOVE */
function moveTo(nx,ny){
  let dx = nx - x;

  if(dx > 0){
    chick.style.transform="scaleX(1)";
  }else{
    chick.style.transform="scaleX(-1)";
  }

  chick.style.left = nx+"px";
  chick.style.top = ny+"px";

  x=nx;
  y=ny;
}

/* 📏 DIST */
function distance(x1,y1,x2,y2){
  return Math.hypot(x1-x2,y1-y2);
}

/* 🖱️ MOUSE */
let mouseX=0, mouseY=0, mouseDist=999;

document.addEventListener("mousemove",(e)=>{
  mouseX=e.clientX;
  mouseY=e.clientY;
  mouseDist = distance(x,y,mouseX,mouseY);
});

/* 💬 BUBBLE */
function showBubble(text){
  bubble.innerText=text;
  bubble.style.left=(x+40)+"px";
  bubble.style.top=(y-10)+"px";
  bubble.style.opacity=1;

  setTimeout(()=>bubble.style.opacity=0,1000);
}

/* LOOP */
setInterval(updateChick,2000);

</script>

</body>
</html>

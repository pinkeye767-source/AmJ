<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>AmJ Game Download</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

/* ================= BASE ================= */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Prompt', sans-serif;
}

body {
  background: radial-gradient(circle at top, #1b2a4a, #050814);
  color: white;
}

/* ================= HEADER ================= */
header {
  display: flex;
  justify-content: space-between;
  padding: 20px 50px;
  background: rgba(0,0,0,0.3);
  backdrop-filter: blur(10px);
}

.logo {
  font-size: 24px;
  font-weight: bold;
  color: #4cc9f0;
}

/* ================= SECTION ================= */
.section {
  padding: 80px 10%;
}

.section h2 {
  font-size: 40px;
  margin-bottom: 30px;
}

/* ================= GRID ================= */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 25px;
}

/* ================= CARD ================= */
.card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  padding: 15px;
  border-radius: 15px;
  transition: 0.4s;
  backdrop-filter: blur(10px);
  cursor: pointer;
}

.card:hover {
  transform: translateY(-10px) scale(1.05);
  box-shadow: 0 0 30px rgba(76,201,240,0.4);
}

/* ================= IMAGE ================= */
.game-img {
  width: 100%;
  border-radius: 10px;
  margin-bottom: 10px;
}

/* ================= TEXT ================= */
.card h3 {
  margin-bottom: 5px;
}

.card p {
  color: #b0c4de;
  margin-bottom: 10px;
}

/* ================= BUTTON ================= */
.btn {
  display: inline-block;
  padding: 10px 20px;
  background: #4cc9f0;
  color: black;
  border-radius: 10px;
  font-weight: bold;
  text-decoration: none;
  transition: 0.3s;
}

/* ปุ่มซ่อนก่อน */
.card .btn {
  opacity: 0;
  transform: translateY(20px);
}

/* hover แล้วเด้ง */
.card:hover .btn {
  opacity: 1;
  transform: translateY(0);
}

.btn:hover {
  box-shadow: 0 0 20px #4cc9f0;
}

/* ================= FOOTER ================= */
footer {
  text-align: center;
  padding: 30px;
  color: #777;
}

</style>
</head>

<body>

<header>
  <div class="logo">AmJ</div>
</header>

<!-- DOWNLOAD GAMES -->
<section class="section">
  <h2>🎮 Download My Games</h2>

  <div class="grid">

    <div class="card">
      <img src="https://via.placeholder.com/300x180" class="game-img">
      <h3>⚡ Warrior Game</h3>
      <p>Action RPG ต่อสู้สุดมันส์</p>
      <a class="btn" href="#" onclick="alert('Coming Soon!')">⬇ Download</a>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/300x180" class="game-img">
      <h3>🔥 Mage Game</h3>
      <p>เวทย์มนต์ + สกิลอลังการ</p>
      <a class="btn" href="#" onclick="alert('Coming Soon!')">⬇ Download</a>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/300x180" class="game-img">
      <h3>🛡 Tank Game</h3>
      <p>สายอึด ป้องกันขั้นเทพ</p>
      <a class="btn" href="#" onclick="alert('Coming Soon!')">⬇ Download</a>
    </div>

  </div>
</section>

<footer>
  © 2026 AmJ Game Download
</footer>

</body>
</html>

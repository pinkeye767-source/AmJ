<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>My Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Prompt', sans-serif;
      background: #0f172a;
      color: white;
    }

    header {
      background: #020617;
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      color: #38bdf8;
    }

    nav a {
      color: white;
      margin-left: 20px;
      text-decoration: none;
    }

    nav a:hover {
      color: #38bdf8;
    }

    .hero {
      text-align: center;
      padding: 80px 20px;
    }

    .hero h2 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #94a3b8;
    }

    .section {
      padding: 60px 20px;
      max-width: 1000px;
      margin: auto;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #020617;
      margin-top: 40px;
    }
  </style>
</head>

<body>

<header>
  <h1>MyWeb</h1>
  <nav>
    <a href="#about">เกี่ยวกับ</a>
    <a href="#portfolio">ผลงาน</a>
    <a href="#contact">ติดต่อ</a>
  </nav>
</header>

<section class="hero">
  <h2>สวัสดี 👋</h2>
  <p>นี่คือเว็บไซต์ของฉัน สร้างด้วย GitHub Pages</p>
</section>

<section id="about" class="section">
  <h2>เกี่ยวกับฉัน</h2>
  <div class="card">
    <p>ใส่ข้อมูลของคุณตรงนี้ เช่น ชื่อ งาน หรือสิ่งที่คุณทำ</p>
  </div>
</section>

<section id="portfolio" class="section">
  <h2>ผลงาน</h2>
  <div class="card">
    <p>โปรเจกต์ 1</p>
  </div>
  <div class="card">
    <p>โปรเจกต์ 2</p>
  </div>
</section>

<section id="contact" class="section">
  <h2>ติดต่อ</h2>
  <div class="card">
    <p>Email: your@email.com</p>
  </div>
</section>

<footer>
  <p>© 2026 My Website</p>
</footer>

</body>
</html>

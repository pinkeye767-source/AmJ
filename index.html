<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Character Switcher</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1020;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  flex-direction:column;
}

/* HERO IMAGE */
.hero-img{
  width:200px;
  height:200px;
  object-fit:cover;
  border-radius:20px;
  box-shadow:0 0 30px rgba(0,255,255,0.3);
  transition:0.3s;
}

h2{
  margin-top:15px;
}

/* BUTTON */
button{
  margin:5px;
  padding:10px 15px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:#4cc9f0;
  color:black;
  font-weight:bold;
  transition:0.2s;
}

button:hover{
  transform:scale(1.05);
  box-shadow:0 0 15px rgba(76,201,240,0.5);
}

</style>
</head>

<body>

<!-- HERO DISPLAY -->
<img class="hero-img" id="heroImg">
<h2 id="heroName"></h2>

<!-- BUTTON CONTROL -->
<div style="margin-top:20px;">
  <button onclick="loadCharacter('girl_hero')">🌸 Luna</button>
  <button onclick="loadCharacter('mage_girl')">🔥 Mira</button>
  <button onclick="loadCharacter('cyber_girl')">⚡ Nova</button>
</div>

<script>

/* =========================
🧠 CHARACTER DATA
========================= */
const characters = {
  girl_hero: {
    name: "Luna",
    img: "https://cdn-icons-png.flaticon.com/512/4140/4140048.png"
  },

  mage_girl: {
    name: "Mira",
    img: "https://cdn-icons-png.flaticon.com/512/4140/4140051.png"
  },

  cyber_girl: {
    name: "Nova",
    img: "https://cdn-icons-png.flaticon.com/512/4140/4140037.png"
  }
};

/* =========================
🎮 CURRENT STATE
========================= */
let currentCharacter = "girl_hero";

/* =========================
⚙️ LOAD CHARACTER FUNCTION
========================= */
function loadCharacter(key){
  const char = characters[key];

  if(!char) return;

  currentCharacter = key;

  document.getElementById("heroImg").src = char.img;
  document.getElementById("heroName").innerText = char.name;
}

/* =========================
🚀 INIT DEFAULT
========================= */
loadCharacter(currentCharacter);

</script>

</body>
</html>

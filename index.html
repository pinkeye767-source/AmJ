<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>AmJ Modular Game Site - Ultra</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

/* ===================================================
⚔️ 1. THEME (DOTA-INSPIRED CINEMATIC STYLE)
=================================================== */
:root{
  --gold:#d4af37;
  --blood:#b11226;
  --dark:#05060a;
  --panel:rgba(10,12,18,0.65);
  --text:#e6e6e6;
  --glow:rgba(212,175,55,0.35);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Prompt',sans-serif;
}

body{
  background:var(--dark);
  color:var(--text);
  overflow-x:hidden;
}

/* ===================================================
🌫️ CINEMATIC LAYERS
=================================================== */
.bg{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 20%, rgba(212,175,55,0.12), transparent 40%),
    radial-gradient(circle at 80% 60%, rgba(177,18,38,0.15), transparent 45%),
    url("https://images.unsplash.com/photo-1606112219348-204d7d8b94ee?auto=format&fit=crop&w=1600&q=80");
  background-size:cover;
  filter:contrast(1.2) brightness(0.4);
  z-index:-3;
}

.vignette{
  position:fixed;
  inset:0;
  background:radial-gradient(circle, transparent 40%, rgba(0,0,0,0.9));
  z-index:-2;
}

/* ===================================================
✨ FLOATING LIGHT
=================================================== */
.light-orb{
  position:fixed;
  width:500px;
  height:500px;
  background:var(--gold);
  filter:blur(180px);
  opacity:0.08;
  top:-100px;
  right:-100px;
  z-index:-1;
}

/* ===================================================
🎯 HEADER (DOTA STYLE)
=================================================== */
header{
  position:fixed;
  width:100%;
  padding:18px 60px;
  display:flex;
  justify-content:space-between;
  background:rgba(0,0,0,0.35);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(212,175,55,0.15);
  z-index:100;
}

.logo{
  font-size:26px;
  font-weight:800;
  color:var(--gold);
  letter-spacing:2px;
}

/* ===================================================
🔥 HERO SECTION (CINEMATIC LAYOUT)
=================================================== */
.hero{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 8%;
}

.hero-text{
  max-width:520px;
  animation:fadeUp 1s ease;
}

.hero-text h1{
  font-size:64px;
  line-height:1.1;
}

.hero-text span{
  color:var(--gold);
  text-shadow:0 0 20px var(--glow);
}

.hero-text p{
  margin:20px 0;
  color:#b8b8b8;
}

/* BUTTON (EPIC STYLE) */
.btn{
  display:inline-block;
  padding:14px 30px;
  background:linear-gradient(135deg,var(--gold),#8c6b1f);
  color:#000;
  font-weight:700;
  border-radius:10px;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 0 20px rgba(212,175,55,0.2);
}

.btn:hover{
  transform:scale(1.08);
  box-shadow:0 0 40px rgba(212,175,55,0.4);
}

/* HERO IMAGE */
.hero-img{
  width:420px;
  filter:drop-shadow(0 0 30px rgba(212,175,55,0.25));
  animation:float 5s ease-in-out infinite;
}

@keyframes float{
  0%{transform:translateY(0);}
  50%{transform:translateY(-18px);}
  100%{transform:translateY(0);}
}

/* ===================================================
🎴 CARDS (HERO UNITS STYLE)
=================================================== */
.section{
  padding:120px 8%;
}

.section h2{
  font-size:42px;
  margin-bottom:30px;
  color:var(--gold);
  letter-spacing:1px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:25px;
}

.card{
  background:var(--panel);
  padding:28px;
  border-radius:14px;
  border:1px solid rgba(212,175,55,0.15);
  backdrop-filter:blur(10px);
  transition:0.35s;
  position:relative;
  overflow:hidden;
}

.card::before{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle at top left, rgba(212,175,55,0.15), transparent 60%);
  opacity:0;
  transition:0.3s;
}

.card:hover{
  transform:translateY(-12px) scale(1.03);
  box-shadow:0 0 35px rgba(212,175,55,0.25);
}

.card:hover::before{
  opacity:1;
}

/* ===================================================
🌟 PARTICLES
=================================================== */
.particle{
  position:fixed;
  width:3px;
  height:3px;
  background:var(--gold);
  border-radius:50%;
  opacity:0.4;
  animation:rise linear infinite;
}

@keyframes rise{
  from{transform:translateY(100vh);}
  to{transform:translateY(-10vh);}
}

/* ===================================================
🎬 VIDEO
=================================================== */
.video{
  width:100%;
  height:480px;
  border-radius:16px;
  border:1px solid rgba(212,175,55,0.2);
  box-shadow:0 0 40px rgba(0,0,0,0.6);
}

/* ===================================================
✨ ANIMATION
=================================================== */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(40px);}
  to{opacity:1;transform:translateY(0);}
}

</style>
</head>

<body>

<!-- BACKGROUND -->
<div class="bg"></div>
<div class="vignette"></div>
<div class="light-orb"></div>

<header>
  <div class="logo">AmJ</div>
</header>

<section class="hero">
  <div class="hero-text">
    <h1>Enter the <span>AmJ Realm</span></h1>
    <p>Epic modular game interface inspired by AAA fantasy UI systems.</p>
    <div class="btn">Play Now</div>
  </div>

  <img class="hero-img" id="heroImg"
  src="https://i.pinimg.com/originals/7c/e3/06/7ce306ca1201a5c34b2a1982d68475ea.gif">
</section>

<section class="section">
  <h2>⚔️ Heroes</h2>
  <div class="grid" id="cardContainer"></div>
</section>

<section class="section">
  <h2>🎬 Battle Showcase</h2>
  <iframe class="video"
    src="https://www.youtube.com/embed/QIbQG2Y_DVE">
  </iframe>
</section>

<script>

/* DATA */
const gameData = [
  { title:"⚔️ Blade Assassin", desc:"High burst + stealth kill" },
  { title:"🔥 Flame Sorcerer", desc:"AoE fire destruction magic" },
  { title:"🛡 Iron Guardian", desc:"Ultimate defense tank role" },
  { title:"⚡ Storm Ranger", desc:"Fast ranged electric DPS" }
];

/* RENDER */
const container=document.getElementById("cardContainer");

gameData.forEach(item=>{
  const div=document.createElement("div");
  div.className="card";
  div.innerHTML=`<h3>${item.title}</h3><p>${item.desc}</p>`;
  container.appendChild(div);
});

/* PARTICLES */
for(let i=0;i<25;i++){
  const p=document.createElement("div");
  p.className="particle";
  p.style.left=Math.random()*100+"vw";
  p.style.animationDuration=(3+Math.random()*6)+"s";
  document.body.appendChild(p);
}

/* HERO FLOAT MOUSE */
const heroImg=document.getElementById("heroImg");

document.addEventListener("mousemove",(e)=>{
  let x=(window.innerWidth/2 - e.clientX)/40;
  let y=(window.innerHeight/2 - e.clientY)/40;

  heroImg.style.transform=
    `rotateY(${x}deg) rotateX(${y}deg) translateY(-10px)`;
});

</script>

</body>

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinkeye Website</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Kanit', sans-serif;
      background: #0f172a;
      color: #fff;
    }

    header {
      display: flex;
      justify-content: space-between;
      padding: 20px 50px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
    }

    header h1 { margin: 0; }

    nav a {
      margin-left: 20px;
      color: white;
      text-decoration: none;
    }

    .hero {
      height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      background: linear-gradient(135deg, #3b82f6, #9333ea);
    }

    .hero h2 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 18px;
      opacity: 0.9;
    }

    .btn {
      margin-top: 20px;
      padding: 12px 24px;
      border-radius: 10px;
      border: none;
      background: white;
      color: #333;
      cursor: pointer;
      font-weight: bold;
    }

    .section {
      padding: 80px 20px;
      text-align: center;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: auto;
    }

    .card {
      background: rgba(255,255,255,0.05);
      padding: 20px;
      border-radius: 15px;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: rgba(255,255,255,0.05);
    }
  </style>
</head>
<body>

<header>
  <h1>Pinkeye</h1>
  <nav>
    <a href="#">หน้าแรก</a>
    <a href="#about">เกี่ยวกับ</a>
    <a href="#service">บริการ</a>
    <a href="#contact">ติดต่อ</a>
  </nav>
</header>

<section class="hero">
  <h2>เว็บไซต์ของฉัน 🚀</h2>
  <p>สร้างด้วย GitHub Pages แบบมืออาชีพ</p>
  <button class="btn" onclick="scrollToSection()">เริ่มต้น</button>
</section>

<section class="section" id="about">
  <h2>เกี่ยวกับฉัน</h2>
  <p>คุณสามารถเขียนข้อมูลเกี่ยวกับตัวเองหรือองค์กรตรงนี้</p>
</section>

<section class="section" id="service">
  <h2>บริการของเรา</h2>
  <div class="cards">
    <div class="card">💻 พัฒนาเว็บไซต์</div>
    <div class="card">📊 วิเคราะห์ข้อมูล</div>
    <div class="card">🎨 ออกแบบ UI/UX</div>
  </div>
</section>

<section class="section" id="contact">
  <h2>ติดต่อ</h2>
  <p>Email: your@email.com</p>
</section>

<footer>
  <p>© 2026 Pinkeye Website</p>
</footer>

<script>
function scrollToSection() {
  document.getElementById('about').scrollIntoView({ behavior: 'smooth' });
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>AmJ - AAA Game World</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

/* ================= RESET ================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Prompt',sans-serif;
}

body{
  background:#050814;
  color:white;
  overflow-x:hidden;
}

/* ================= PARTICLES ================= */
.particle{
  position:fixed;
  width:6px;
  height:6px;
  background:#4cc9f0;
  border-radius:50%;
  opacity:0.5;
  animation: floatUp linear infinite;
}

@keyframes floatUp{
  from{transform:translateY(100vh);opacity:0;}
  50%{opacity:1;}
  to{transform:translateY(-10vh);opacity:0;}
}

/* ================= BACKGROUND ================= */
.bg1,.bg2{
  position:fixed;
  width:800px;
  height:800px;
  border-radius:50%;
  filter:blur(150px);
  opacity:0.2;
  z-index:-1;
}

.bg1{background:#4cc9f0;top:-200px;left:-200px;}
.bg2{background:#ff006e;bottom:-200px;right:-200px;}

/* ================= HEADER ================= */
header{
  position:fixed;
  width:100%;
  padding:20px 60px;
  display:flex;
  justify-content:space-between;
  background:rgba(0,0,0,0.2);
  backdrop-filter:blur(10px);
  z-index:100;
}

.logo{
  color:#4cc9f0;
  font-size:24px;
  font-weight:800;
}

/* ================= HERO ================= */
.hero{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10%;
  perspective:1000px;
}

/* HERO TEXT */
.hero-text{
  max-width:500px;
  animation:fadeIn 1s ease;
}

.hero-text h1{
  font-size:60px;
}

.hero-text span{
  color:#4cc9f0;
}

.hero-text p{
  color:#b0c4de;
  margin:20px 0;
}

.btn{
  display:inline-block;
  padding:12px 25px;
  background:#4cc9f0;
  color:black;
  border-radius:12px;
  font-weight:bold;
  transition:0.3s;
}

.btn:hover{
  transform:scale(1.1);
  box-shadow:0 0 25px #4cc9f0;
}

/* HERO IMAGE (3D FOLLOW MOUSE) */
.hero-img{
  width:380px;
  transition:0.2s;
  animation:float 4s ease-in-out infinite;
  transform-style:preserve-3d;
}

@keyframes float{
  0%{transform:translateY(0);}
  50%{transform:translateY(-20px);}
  100%{transform:translateY(0);}
}

/* ================= SECTION ================= */
.section{
  padding:120px 10%;
}

.section h2{
  font-size:40px;
  margin-bottom:30px;
  animation:fadeUp 1s ease;
}

/* ================= CARDS ================= */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:25px;
}

.card{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  padding:25px;
  border-radius:18px;
  backdrop-filter:blur(10px);
  transition:0.3s;
  transform:translateY(0);
  animation:fadeUp 1s ease;
}

.card:hover{
  transform:translateY(-15px) scale(1.05);
  box-shadow:0 0 40px rgba(76,201,240,0.5);
}

/* ================= VIDEO ================= */
.video{
  width:100%;
  height:450px;
  border-radius:18px;
  border:none;
  box-shadow:0 0 30px rgba(0,0,0,0.5);
}

/* ================= ANIMATIONS ================= */
@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(50px);}
  to{opacity:1;transform:translateY(0);}
}

/* ================= CURSOR GLOW ================= */
.cursor-glow{
  position:fixed;
  width:20px;
  height:20px;
  background:#4cc9f0;
  border-radius:50%;
  pointer-events:none;
  mix-blend-mode:screen;
  transform:translate(-50%,-50%);
  filter:blur(8px);
}

</style>
</head>

<body>

<div class="bg1"></div>
<div class="bg2"></div>
<div class="cursor-glow" id="cursor"></div>

<header>
  <div class="logo">AmJ</div>
</header>

<!-- HERO -->
<section class="hero">

  <div class="hero-text">
    <h1>Welcome to <span>AmJ World</span></h1>
    <p>
      สไตล์เว็บระดับเกม AAA แบบ :contentReference[oaicite:2]{index=2}  
      inspired by :contentReference[oaicite:3]{index=3}
    </p>

    <a class="btn">Play Now</a>
  </div>

  <img class="hero-img" id="heroImg"
    src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png">

</section>

<!-- SECTION -->
<section class="section">
  <h2>🔥 Characters</h2>

  <div class="grid">
    <div class="card">⚡ Speed Fighter</div>
    <div class="card">🔥 Fire Mage</div>
    <div class="card">🛡 Tank Guard</div>
  </div>
</section>

<!-- VIDEO -->
<section class="section">
  <h2>🎬 Gameplay</h2>

  <iframe class="video"
    src="https://www.youtube.com/embed/QIbQG2Y_DVE"
    allowfullscreen>
  </iframe>

</section>

<script>

/* ================= PARTICLES ================= */
for(let i=0;i<25;i++){
  let p=document.createElement("div");
  p.className="particle";
  p.style.left=Math.random()*100+"vw";
  p.style.animationDuration=(3+Math.random()*5)+"s";
  p.style.opacity=Math.random();
  document.body.appendChild(p);
}

/* ================= CURSOR ================= */
const cursor=document.getElementById("cursor");

document.addEventListener("mousemove",(e)=>{
  cursor.style.left=e.clientX+"px";
  cursor.style.top=e.clientY+"px";
});

/* ================= HERO 3D FOLLOW ================= */
const heroImg=document.getElementById("heroImg");

document.addEventListener("mousemove",(e)=>{
  let x=(window.innerWidth/2 - e.clientX)/25;
  let y=(window.innerHeight/2 - e.clientY)/25;

  heroImg.style.transform=
    `rotateY(${x}deg) rotateX(${y}deg) translateY(-10px)`;
});

</script>

</body>
</html>

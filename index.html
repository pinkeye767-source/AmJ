<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>My Videos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Prompt&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Prompt', sans-serif;
      background: #0f172a;
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #020617;
      color: #38bdf8;
      font-size: 22px;
    }

    .player {
      max-width: 900px;
      margin: 30px auto;
    }

    .player iframe {
      width: 100%;
      height: 500px;
      border-radius: 15px;
      border: none;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
      padding: 30px;
    }

    /* 🎴 card */
    .video-card {
      perspective: 1000px;
      cursor: pointer;
    }

    .card-inner {
      position: relative;
      border-radius: 15px;
      overflow: hidden;
      transition: transform 0.1s ease;
      transform-style: preserve-3d;
    }

    .card-inner img {
      width: 100%;
      display: block;
      border-radius: 15px;
    }

    .video-title {
      margin-top: 10px;
      font-size: 14px;
      color: #e2e8f0;
    }

    /* ✨ แสงสะท้อน */
    .glare {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.4), transparent);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .card-inner:hover .glare {
      opacity: 1;
    }
  </style>
</head>

<body>

<header>🎬 My Channel</header>

<div class="player">
  <iframe id="main-video" src="https://www.youtube.com/embed/QIbQG2Y_DVE"></iframe>
</div>

<div class="video-grid">

  <!-- card -->
  <div class="video-card" onclick="playVideo('QIbQG2Y_DVE')">
    <div class="card-inner">
      <img src="https://img.youtube.com/vi/QIbQG2Y_DVE/hqdefault.jpg">
      <div class="glare"></div>
    </div>
    <div class="video-title">Highlight 🔥</div>
  </div>

  <div class="video-card" onclick="playVideo('2u9g9D5_bx4')">
    <div class="card-inner">
      <img src="https://img.youtube.com/vi/2u9g9D5_bx4/hqdefault.jpg">
      <div class="glare"></div>
    </div>
    <div class="video-title">Funny 😂</div>
  </div>

  <div class="video-card" onclick="playVideo('b-gBRB0wboE')">
    <div class="card-inner">
      <img src="https://img.youtube.com/vi/b-gBRB0wboE/hqdefault.jpg">
      <div class="glare"></div>
    </div>
    <div class="video-title">Epic ⚡</div>
  </div>

  <div class="video-card" onclick="playVideo('8Gt7-7k_GIk')">
    <div class="card-inner">
      <img src="https://img.youtube.com/vi/8Gt7-7k_GIk/hqdefault.jpg">
      <div class="glare"></div>
    </div>
    <div class="video-title">Short 🎯</div>
  </div>

</div>

<script>
function playVideo(id) {
  document.getElementById("main-video").src =
    "https://www.youtube.com/embed/" + id + "?autoplay=1";
}

/* 🎯 3D tracking */
document.querySelectorAll(".video-card").forEach(card => {
  const inner = card.querySelector(".card-inner");

  card.addEventListener("mousemove", (e) => {
    const rect = card.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    const midX = rect.width / 2;
    const midY = rect.height / 2;

    const rotateY = (x - midX) / 15;
    const rotateX = -(y - midY) / 15;

    inner.style.transform = `rotateY(${rotateY}deg) rotateX(${rotateX}deg) scale(1.05)`;
  });

  card.addEventListener("mouseleave", () => {
    inner.style.transform = "rotateY(0) rotateX(0) scale(1)";
  });
});
</script>

</body>
</html>

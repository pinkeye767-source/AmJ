<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My First GitHub Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
      color: #333;
    }
    header {
      background: #24292e;
      color: white;
      padding: 20px;
      text-align: center;
    }
    nav {
      background: #0366d6;
      padding: 10px;
      text-align: center;
    }
    nav a {
      color: white;
      margin: 0 10px;
      text-decoration: none;
      font-weight: bold;
    }
    nav a:hover {
      text-decoration: underline;
    }
    .container {
      padding: 20px;
      max-width: 900px;
      margin: auto;
      background: white;
      border-radius: 8px;
      margin-top: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    footer {
      text-align: center;
      padding: 15px;
      margin-top: 20px;
      background: #ddd;
    }
    button {
      padding: 10px 15px;
      border: none;
      background: #28a745;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #218838;
    }
  </style>
</head>
<body>
  <header>
    <h1>ยินดีต้อนรับสู่เว็บไซต์ของฉัน 🚀</h1>
    <p>สร้างด้วย GitHub Pages</p>
  </header>

  <nav>
    <a href="#home">หน้าแรก</a>
    <a href="#about">เกี่ยวกับ</a>
    <a href="#contact">ติดต่อ</a>
  </nav>

  <div class="container" id="home">
    <h2>หน้าแรก</h2>
    <p>นี่คือเว็บไซต์แรกของคุณที่โฮสต์ฟรีบน GitHub Pages</p>
    <button onclick="sayHello()">คลิกฉัน</button>
  </div>

  <div class="container" id="about">
    <h2>เกี่ยวกับฉัน</h2>
    <p>คุณสามารถแก้ไขข้อความนี้ให้เป็นข้อมูลของคุณเองได้</p>
  </div>

  <div class="container" id="contact">
    <h2>ติดต่อ</h2>
    <p>Email: your@email.com</p>
  </div>

  <footer>
    <p>© 2026 My Website</p>
  </footer>

  <script>
    function sayHello() {
      alert("สวัสดี! ยินดีต้อนรับ 😄");
    }
  </script>
</body>
</html>

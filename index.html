<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartFarmGIS Pro</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw/dist/leaflet.draw.css"/>
<style>
html,body,#map{height:100%;margin:0}
#map{z-index:1}
.panel{position:absolute;top:10px;left:10px;z-index:1000;background:#fff;padding:12px;border-radius:12px;max-width:320px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
button{margin:2px;padding:6px 10px}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
<h3>🌾 SmartFarmGIS Pro</h3>
<div id="sum">พร้อมใช้งาน</div>
<button onclick="exportGeoJSON()">Export GeoJSON</button>
<input type="file" id="importFile">
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw/dist/leaflet.draw.js"></script>
<script src="https://unpkg.com/@turf/turf/turf.min.js"></script>
<script>
const map=L.map('map').setView([14.9799,102.0977],15);

const esri=L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{attribution:'Esri'}).addTo(map);

const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png');

L.control.layers({"Satellite":esri,"OSM":osm}).addTo(map);

const fg=new L.FeatureGroup().addTo(map);

map.addControl(new L.Control.Draw({
 edit:{featureGroup:fg},
 draw:{polygon:true,rectangle:true,circle:false,marker:false,polyline:false,circlemarker:false}
}));

let features=[];

map.on(L.Draw.Event.CREATED,e=>{
 const layer=e.layer;
 fg.addLayer(layer);
 const gj=layer.toGeoJSON();
 const area=turf.area(gj);
 gj.properties={area_m2:area,area_rai:(area/1600).toFixed(2)};
 features.push(gj);
 document.getElementById("sum").innerHTML="พื้นที่ "+(area/1600).toFixed(2)+" ไร่";
 save();
});

function save(){
 localStorage.setItem("smartfarm_features",JSON.stringify(features));
}

function load(){
 const d=JSON.parse(localStorage.getItem("smartfarm_features")||"[]");
 features=d;
 d.forEach(g=>L.geoJSON(g).eachLayer(l=>fg.addLayer(l)));
}
load();

function exportGeoJSON(){
 const blob=new Blob([JSON.stringify({type:"FeatureCollection",features},null,2)],{type:"application/json"});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='farm.geojson';
 a.click();
}

document.getElementById('importFile').addEventListener('change',e=>{
 const f=e.target.files[0];
 if(!f) return;
 const r=new FileReader();
 r.onload=()=>{
   const gj=JSON.parse(r.result);
   gj.features.forEach(ft=>{
      features.push(ft);
      L.geoJSON(ft).eachLayer(l=>fg.addLayer(l));
   });
   save();
 };
 r.readAsText(f);
});

if('serviceWorker' in navigator){
 navigator.serviceWorker.register('service-worker.js');
}
</script>
</body>
</html>

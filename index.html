<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AmJ AAA Game Web</title>

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
/* ================= BASE ================= */
body {
  margin:0;
  font-family:'Prompt',sans-serif;
  background:#050814;
  color:white;
  overflow-x:hidden;
}

/* ================= HERO ================= */
.hero {
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

.hero h1 {
  font-size:60px;
}

/* ================= XP BAR ================= */
.xp-bar {
  width:300px;
  height:20px;
  background:#222;
  border-radius:20px;
  overflow:hidden;
  margin-top:20px;
}

.xp-fill {
  height:100%;
  width:30%;
  background:linear-gradient(90deg,#4cc9f0,#90dbf4);
}

/* ================= CARD ================= */
.grid {
  display:flex;
  gap:20px;
  padding:50px;
}

.card {
  width:200px;
  height:150px;
  background:#111;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:0.2s;
}

/* ================= CHARACTER ================= */
.character {
  position:fixed;
  width:80px;
  top:50%;
  left:50%;
  transition:0.2s;
}

/* ================= INVENTORY ================= */
.inventory {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:10px;
}

.slot {
  width:60px;
  height:60px;
  background:#222;
  border-radius:10px;
}

/* ================= VIDEOS ================= */
.videos {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:50px;
}

.video-card iframe {
  width:100%;
  height:200px;
  border-radius:10px;
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
  <h1>AmJ AAA World</h1>
  <div class="xp-bar"><div class="xp-fill" id="xp"></div></div>
</div>

<!-- CARDS -->
<div class="grid">
  <div class="card">Warrior</div>
  <div class="card">Mage</div>
  <div class="card">Tank</div>
</div>

<!-- CHARACTER AI -->
<img src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png" class="character" id="char">

<!-- INVENTORY -->
<div class="inventory">
  <div class="slot"></div>
  <div class="slot"></div>
  <div class="slot"></div>
</div>

<!-- VIDEOS -->
<div class="videos" id="videos"></div>

<script>
/* ================= AI CHARACTER ================= */
const char = document.getElementById('char');
let mouseX = 0;
let mouseY = 0;

document.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

function moveChar(){
  let rect = char.getBoundingClientRect();
  let dx = mouseX - rect.left;
  let dy = mouseY - rect.top;

  // หนีเมาส์
  char.style.left = (rect.left - dx*0.02) + 'px';
  char.style.top = (rect.top - dy*0.02) + 'px';

  requestAnimationFrame(moveChar);
}
moveChar();

/* ================= XP SYSTEM ================= */
let xp = 30;

document.body.addEventListener('click', ()=>{
  xp += 5;
  document.getElementById('xp').style.width = xp + '%';
});

/* ================= YOUTUBE API ================= */
const API_KEY = 'YOUR_API_KEY';
const CHANNEL_ID = 'YOUR_CHANNEL_ID';

async function loadVideos(){
  const res = await fetch(`https://www.googleapis.com/youtube/v3/search?key=${API_KEY}&channelId=${CHANNEL_ID}&part=snippet,id&order=date&maxResults=6`);
  const data = await res.json();

  const container = document.getElementById('videos');

  data.items.forEach(v=>{
    if(v.id.videoId){
      container.innerHTML += `
        <div class="video-card">
          <iframe src="https://www.youtube.com/embed/${v.id.videoId}" allowfullscreen></iframe>
        </div>
      `;
    }
  });
}

loadVideos();
</script>

</body>
</html>
